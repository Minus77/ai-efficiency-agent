[project]
name = "aiea"
version = "1.0.0"
description = "中小企业 AI 提效场景识别 Agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.34.0",
  "pydantic==2.10.4",
  # httpx[socks]：环境里存在 SOCKS 代理时必需，否则请求在传输层就失败
  "httpx[socks]==0.28.1",
  "socksio==1.0.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
